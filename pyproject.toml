[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "code-grinder"
version = "2.2.0"
description = "Recoverable, reviewed changes from small local AI models"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "watchdog>=5.0",
    "typer>=0.12",
    "rich>=13.7",
    "filelock>=3.16",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["grinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
